    </text>
    <line x1="0" y1="42" x2="760" y2="42" stroke="#3a352f" stroke-dasharray="2 3"/>
  </g>
  <g transform="translate(220 380)" font-family="ui-monospace, Geist Mono, Menlo" font-size="12">
    <g><text x="0"   y="0" fill="#9c958a">14:32:04</text><text x="78" y="0" fill="#ece6d8">app/controllers/orders_controller.rb</text><text x="760" y="0" fill="#8db8e0" font-size="10" letter-spacing="0.8" text-anchor="end">READ</text></g>
    <g transform="translate(0 22)"><text x="0" y="0" fill="#9c958a">14:32:06</text><text x="78" y="0" fill="#ece6d8">app/models/order.rb <tspan fill="#8a837a">· 312 lines</tspan></text><text x="760" y="0" fill="#8db8e0" font-size="10" letter-spacing="0.8" text-anchor="end">READ</text></g>
    <g transform="translate(0 44)"><text x="0" y="0" fill="#9c958a">14:32:08</text><text x="78" y="0" fill="#ece6d8">app/views/orders/index.html.erb</text><text x="760" y="0" fill="#8db8e0" font-size="10" letter-spacing="0.8" text-anchor="end">READ</text></g>
    <g transform="translate(0 66)"><text x="0" y="0" fill="#9c958a">14:32:10</text><text x="78" y="0" fill="#ece6d8">spec/requests/orders_spec.rb</text><text x="760" y="0" fill="#8db8e0" font-size="10" letter-spacing="0.8" text-anchor="end">READ</text></g>
    <g transform="translate(0 88)"><text x="0" y="0" fill="#9c958a">14:32:14</text><text x="78" y="0" fill="#ece6d8">grep <tspan fill="#8a837a">"to_csv"</tspan> in app/</text><text x="760" y="0" fill="#8db8e0" font-size="10" letter-spacing="0.8" text-anchor="end">SEARCH · 3 HITS</text></g>
  </g>

  <g transform="translate(220 504)">
    <rect x="-10" y="6" width="2" height="32" fill="#ec9358" fill-opacity="0.55" rx="1"/>
    <text x="0" y="20" font-family="ui-monospace, Geist Mono, Menlo" font-size="12" font-weight="500" letter-spacing="1.6" fill="#ec9358">02 ·</text>
    <text x="74" y="22" font-family="Source Serif 4, Georgia, serif" font-size="22" fill="#ece6d8">Edit &amp; write</text>
    <text x="760" y="22" font-family="ui-monospace, Geist Mono, Menlo" font-size="11" fill="#9c958a" text-anchor="end">
