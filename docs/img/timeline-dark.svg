  <g transform="translate(220 556)" font-family="ui-monospace, Geist Mono, Menlo" font-size="12">
    <text x="0"   y="0" fill="#8a837a" font-size="10" letter-spacing="1.4">FILE</text>
    <text x="560" y="0" fill="#8a837a" font-size="10" letter-spacing="1.4">CHANGE</text>
    <text x="700" y="0" fill="#8a837a" font-size="10" letter-spacing="1.4">AT</text>
    <line x1="0" y1="10" x2="760" y2="10" stroke="#3a352f"/>
    <g transform="translate(0 28)">
      <text x="0" y="0" fill="#8a837a">▸</text>
      <text x="16" y="0" fill="#ece6d8">app/controllers/orders_controller.rb <tspan fill="#8a837a">action #export</tspan></text>
      <text x="560" y="0"><tspan fill="#7dc097">+34</tspan> <tspan fill="#e89090">−2</tspan></text>
