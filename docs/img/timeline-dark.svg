  <rect x="0" y="710" width="1200" height="270" fill="#15130f"/>
  <line x1="0" y1="710" x2="1200" y2="710" stroke="#2a2620" stroke-dasharray="2 3"/>
  <rect x="180" y="734" width="3" height="220" fill="#a5cca0" rx="1.5"/>
  <g transform="translate(220 750)">
    <text x="0" y="0" font-family="-apple-system, ui-sans-serif" font-size="11" font-weight="500" letter-spacing="1.8" fill="#a5cca0">RESPONSE</text>
    <text x="86" y="0" font-family="Source Serif 4, Georgia, serif" font-style="italic" font-size="13" fill="#cac3b5">— Claude, 3m 26s</text>
    <text x="0" y="40" font-family="Source Serif 4, Georgia, serif" font-size="22" fill="#d6cfbf" letter-spacing="-0.2">Done. New <tspan font-family="ui-monospace, Geist Mono, Menlo" font-size="14" fill="#f3a570">GET /orders.csv</tspan> endpoint mirrors the index filters and</text>
    <text x="0" y="68" font-family="Source Serif 4, Georgia, serif" font-size="22" fill="#d6cfbf" letter-spacing="-0.2">returns the receipt column order.</text>
    <text x="0" y="106" font-family="Source Serif 4, Georgia, serif" font-size="16" fill="#cac3b5">The JSON export at <tspan font-family="ui-monospace, Geist Mono, Menlo" font-size="12.5" fill="#f3a570">/orders.json</tspan> is untouched — the CSV path branches inside</text>
    <text x="0" y="128" font-family="Source Serif 4, Georgia, serif" font-size="16" fill="#cac3b5"><tspan font-family="ui-monospace, Geist Mono, Menlo" font-size="12.5" fill="#f3a570">respond_to</tspan> so the wire format is the only difference. All 14 request specs pass,</text>
    <text x="0" y="150" font-family="Source Serif 4, Georgia, serif" font-size="16" fill="#cac3b5">including 8 new ones covering empty results and the date-range edge cases.</text>
    <text x="0" y="188" font-family="Source Serif 4, Georgia, serif" font-size="16" fill="#cac3b5">Worth flagging before merge: large exports stream chunked, so cancelling the</text>
    <text x="0" y="210" font-family="Source Serif 4, Georgia, serif" font-size="16" fill="#cac3b5">request mid-download leaves a partial file.</text>
  </g>
