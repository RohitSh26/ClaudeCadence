  <text x="32" y="32" font-family="ui-monospace, Geist Mono, Menlo" font-size="11" letter-spacing="1.4" fill="#9c958a">CLAUDE<tspan fill="#ece6d8" font-weight="500">CADENCE</tspan></text>
  <text x="142" y="32" font-family="Source Serif 4, Georgia, serif" font-style="italic" font-size="13" fill="#ec9358">BloomList</text>
