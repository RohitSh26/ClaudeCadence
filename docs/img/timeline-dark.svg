  <g transform="translate(220 132)">
    <text x="0" y="0" font-family="-apple-system, ui-sans-serif" font-size="11" font-weight="500" letter-spacing="1.8" fill="#ec9358">PROMPT</text>
    <text x="68" y="0" font-family="Source Serif 4, Georgia, serif" font-style="italic" font-size="13" fill="#9c958a">— you, 4m ago</text>
    <text x="0" y="40" font-family="Source Serif 4, Georgia, serif" font-size="30" fill="#ece6d8" letter-spacing="-0.4">Add an opt-in CSV export to the orders page —</text>
    <text x="0" y="78" font-family="Source Serif 4, Georgia, serif" font-size="30" fill="#ece6d8" letter-spacing="-0.4">include status filter, date range, per-row totals.</text>
    <text x="0" y="114" font-family="Source Serif 4, Georgia, serif" font-size="17" fill="#cac3b5">Match the column order from the customer-facing receipt:</text>
    <text x="0" y="138" font-family="Source Serif 4, Georgia, serif" font-style="italic" font-size="17" fill="#cac3b5">order id, placed at, customer, status, items, subtotal, tax, total.</text>
    <text x="0" y="162" font-family="Source Serif 4, Georgia, serif" font-size="17" fill="#cac3b5">Don't break the existing JSON export; this is a separate endpoint.</text>
  </g>

  <g transform="translate(220 332)">
