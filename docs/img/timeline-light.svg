<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" font-family="-apple-system, system-ui, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="topbarFadeL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafaf7"/>
      <stop offset="100%" stop-color="#fafaf7" stop-opacity="0.94"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="980" fill="#fafaf7"/>

  <!-- ─── sticky thin topbar ─── -->
  <rect x="0" y="0" width="1200" height="52" fill="url(#topbarFadeL)"/>
  <line x1="0" y1="52" x2="1200" y2="52" stroke="#e8e6e0"/>
  <text x="32" y="32" font-family="ui-monospace, Geist Mono, Menlo" font-size="11" letter-spacing="1.4" fill="#6b6b6b">CLAUDE<tspan fill="#0a0a0a" font-weight="500">CADENCE</tspan></text>
  <text x="142" y="32" font-family="Source Serif 4, Georgia, serif" font-style="italic" font-size="13" fill="#c2570b">BloomList</text>
  <text x="540" y="29" font-family="ui-monospace, Geist Mono, Menlo" font-size="10" letter-spacing="1.2" fill="#a8a6a0">SESSION</text>
  <text x="608" y="32" font-family="Source Serif 4, Georgia, serif" font-style="italic" font-size="14" fill="#0a0a0a">today's working session</text>
  <text x="820" y="33" font-family="ui-monospace, Geist Mono, Menlo" font-size="10" fill="#6b6b6b">▾</text>
  <rect x="1010" y="14" width="68" height="24" rx="12" fill="none" stroke="#e8e6e0"/>
  <text x="1044" y="31" font-family="ui-monospace, Geist Mono, Menlo" font-size="11" fill="#2e2e2c" text-anchor="middle">filter</text>
  <circle cx="1110" cy="26" r="13" fill="none" stroke="#e8e6e0"/>
  <circle cx="1110" cy="26" r="3.5" fill="none" stroke="#6b6b6b" stroke-width="1.4"/>
  <g stroke="#6b6b6b" stroke-width="1.4" stroke-linecap="round" transform="translate(1110 26)">
    <path d="M0 -6.5v2M0 4.5v2M-6.5 0h2M4.5 0h2M-4.6 -4.6l1.3 1.3M3.3 3.3l1.3 1.3M-4.6 4.6l1.3 -1.3M3.3 -3.3l1.3 -1.3"/>
  </g>

  <!-- ─── turn meta strip ─── -->
  <g transform="translate(220 92)" font-family="ui-monospace, Geist Mono, Menlo" font-size="11" fill="#6b6b6b">
    <circle cx="5" cy="-4" r="4" fill="#2f7a4d"/>
    <text x="14" y="0" fill="#2e2e2c">replied</text>
    <text x="80" y="0" fill="#a8a6a0">at</text>
    <text x="100" y="0" fill="#2e2e2c">Tue 13 May · 14:32</text>
    <text x="260" y="0" fill="#a8a6a0">duration</text>
    <text x="320" y="0" fill="#2e2e2c">4m 18s</text>
    <text x="380" y="0" fill="#a8a6a0">events</text>
    <text x="430" y="0" fill="#2e2e2c">12</text>
    <text x="465" y="0" fill="#a8a6a0">turn</text>
    <text x="500" y="0" fill="#2e2e2c">t_8f3a4c2b1d</text>
  </g>

  <!-- ─── prompt hero ─── -->
  <g transform="translate(220 132)">
    <text x="0" y="0" font-family="-apple-system, ui-sans-serif" font-size="11" font-weight="500" letter-spacing="1.8" fill="#c2570b">PROMPT</text>
    <text x="68" y="0" font-family="Source Serif 4, Georgia, serif" font-style="italic" font-size="13" fill="#6b6b6b">— you, 4m ago</text>
    <text x="0" y="40" font-family="Source Serif 4, Georgia, serif" font-size="30" fill="#0a0a0a" letter-spacing="-0.4">Add an opt-in CSV export to the orders page —</text>
    <text x="0" y="78" font-family="Source Serif 4, Georgia, serif" font-size="30" fill="#0a0a0a" letter-spacing="-0.4">include status filter, date range, per-row totals.</text>
    <text x="0" y="114" font-family="Source Serif 4, Georgia, serif" font-size="17" fill="#2e2e2c">Match the column order from the customer-facing receipt:</text>
    <text x="0" y="138" font-family="Source Serif 4, Georgia, serif" font-style="italic" font-size="17" fill="#2e2e2c">order id, placed at, customer, status, items, subtotal, tax, total.</text>
    <text x="0" y="162" font-family="Source Serif 4, Georgia, serif" font-size="17" fill="#2e2e2c">Don't break the existing JSON export; this is a separate endpoint.</text>
  </g>

  <!-- ─── phase 01 — read & locate ─── -->
  <g transform="translate(220 332)">
    <rect x="-6" y="0" width="76" height="42" rx="6" fill="#ffe5d2" fill-opacity="0.35"/>
    <text x="0" y="20" font-family="ui-monospace, Geist Mono, Menlo" font-size="12" font-weight="500" letter-spacing="1.6" fill="#c2570b">01 ·</text>
    <text x="74" y="22" font-family="Source Serif 4, Georgia, serif" font-size="22" fill="#0a0a0a">Read &amp; locate</text>
    <text x="760" y="22" font-family="ui-monospace, Geist Mono, Menlo" font-size="11" fill="#6b6b6b" text-anchor="end">
      <tspan fill="#2e2e2c">5</tspan> files · <tspan fill="#2e2e2c">12</tspan>s
    </text>
    <line x1="0" y1="42" x2="760" y2="42" stroke="#d4d2cc" stroke-dasharray="2 3"/>
  </g>
  <g transform="translate(220 380)" font-family="ui-monospace, Geist Mono, Menlo" font-size="12">
    <g><text x="0"   y="0" fill="#6b6b6b">14:32:04</text><text x="78" y="0" fill="#0a0a0a">app/controllers/orders_controller.rb</text><text x="760" y="0" fill="#2c5f8f" font-size="10" letter-spacing="0.8" text-anchor="end">READ</text></g>
    <g transform="translate(0 22)"><text x="0" y="0" fill="#6b6b6b">14:32:06</text><text x="78" y="0" fill="#0a0a0a">app/models/order.rb <tspan fill="#a8a6a0">· 312 lines</tspan></text><text x="760" y="0" fill="#2c5f8f" font-size="10" letter-spacing="0.8" text-anchor="end">READ</text></g>
    <g transform="translate(0 44)"><text x="0" y="0" fill="#6b6b6b">14:32:08</text><text x="78" y="0" fill="#0a0a0a">app/views/orders/index.html.erb</text><text x="760" y="0" fill="#2c5f8f" font-size="10" letter-spacing="0.8" text-anchor="end">READ</text></g>
    <g transform="translate(0 66)"><text x="0" y="0" fill="#6b6b6b">14:32:10</text><text x="78" y="0" fill="#0a0a0a">spec/requests/orders_spec.rb</text><text x="760" y="0" fill="#2c5f8f" font-size="10" letter-spacing="0.8" text-anchor="end">READ</text></g>
    <g transform="translate(0 88)"><text x="0" y="0" fill="#6b6b6b">14:32:14</text><text x="78" y="0" fill="#0a0a0a">grep <tspan fill="#a8a6a0">"to_csv"</tspan> in app/</text><text x="760" y="0" fill="#2c5f8f" font-size="10" letter-spacing="0.8" text-anchor="end">SEARCH · 3 HITS</text></g>
  </g>

  <!-- ─── phase 02 — edit & write ─── -->
  <g transform="translate(220 504)">
    <rect x="-6" y="0" width="76" height="42" rx="6" fill="#ffe5d2" fill-opacity="0.35"/>
    <text x="0" y="20" font-family="ui-monospace, Geist Mono, Menlo" font-size="12" font-weight="500" letter-spacing="1.6" fill="#c2570b">02 ·</text>
    <text x="74" y="22" font-family="Source Serif 4, Georgia, serif" font-size="22" fill="#0a0a0a">Edit &amp; write</text>
    <text x="760" y="22" font-family="ui-monospace, Geist Mono, Menlo" font-size="11" fill="#6b6b6b" text-anchor="end">
      <tspan fill="#2e2e2c">4</tspan> files · <tspan fill="#2f7a4d">+147</tspan> <tspan fill="#b53d3d">−8</tspan>
    </text>
    <line x1="0" y1="42" x2="760" y2="42" stroke="#d4d2cc" stroke-dasharray="2 3"/>
  </g>
  <g transform="translate(220 556)" font-family="ui-monospace, Geist Mono, Menlo" font-size="12">
    <text x="0"   y="0" fill="#a8a6a0" font-size="10" letter-spacing="1.4">FILE</text>
    <text x="560" y="0" fill="#a8a6a0" font-size="10" letter-spacing="1.4">CHANGE</text>
    <text x="700" y="0" fill="#a8a6a0" font-size="10" letter-spacing="1.4">AT</text>
    <line x1="0" y1="10" x2="760" y2="10" stroke="#d4d2cc"/>
    <g transform="translate(0 28)">
      <text x="0" y="0" fill="#a8a6a0">▸</text>
      <text x="16" y="0" fill="#0a0a0a">app/controllers/orders_controller.rb <tspan fill="#a8a6a0">action #export</tspan></text>
      <text x="560" y="0"><tspan fill="#2f7a4d">+34</tspan> <tspan fill="#b53d3d">−2</tspan></text>
      <text x="700" y="0" fill="#6b6b6b">14:33:08</text>
      <line x1="0" y1="14" x2="760" y2="14" stroke="#e8e6e0" stroke-dasharray="2 3"/>
    </g>
    <g transform="translate(0 50)">
      <text x="0" y="0" fill="#a8a6a0">▸</text>
      <text x="16" y="0" fill="#0a0a0a">app/models/order.rb <tspan fill="#a8a6a0">·to_csv_row helper</tspan></text>
      <text x="560" y="0"><tspan fill="#2f7a4d">+18</tspan></text>
      <text x="700" y="0" fill="#6b6b6b">14:33:41</text>
      <line x1="0" y1="14" x2="760" y2="14" stroke="#e8e6e0" stroke-dasharray="2 3"/>
    </g>
    <g transform="translate(0 72)">
      <text x="0" y="0" fill="#a8a6a0">▸</text>
      <text x="16" y="0" fill="#0a0a0a">config/routes.rb</text>
      <text x="560" y="0"><tspan fill="#2f7a4d">+1</tspan></text>
      <text x="700" y="0" fill="#6b6b6b">14:33:55</text>
      <line x1="0" y1="14" x2="760" y2="14" stroke="#e8e6e0" stroke-dasharray="2 3"/>
    </g>
    <g transform="translate(0 94)">
      <text x="0" y="0" fill="#a8a6a0">▸</text>
      <text x="16" y="0" fill="#0a0a0a">spec/requests/orders_spec.rb</text>
      <text x="560" y="0"><tspan fill="#2f7a4d">+94</tspan> <tspan fill="#b53d3d">−6</tspan></text>
      <text x="700" y="0" fill="#6b6b6b">14:34:22</text>
    </g>
  </g>

  <!-- ─── response band ─── -->
  <rect x="0" y="710" width="1200" height="270" fill="#eef4ec"/>
  <line x1="0" y1="710" x2="1200" y2="710" stroke="#bcd5b9"/>
  <g transform="translate(220 750)">
    <text x="0" y="0" font-family="-apple-system, ui-sans-serif" font-size="11" font-weight="500" letter-spacing="1.8" fill="#5f9763">RESPONSE</text>
    <text x="86" y="0" font-family="Source Serif 4, Georgia, serif" font-style="italic" font-size="13" fill="#2e2e2c">— Claude, 3m 26s</text>
    <text x="0" y="40" font-family="Source Serif 4, Georgia, serif" font-size="22" fill="#1a1a1a" letter-spacing="-0.2">Done. New <tspan font-family="ui-monospace, Geist Mono, Menlo" font-size="14">GET /orders.csv</tspan> endpoint mirrors the index filters and</text>
    <text x="0" y="68" font-family="Source Serif 4, Georgia, serif" font-size="22" fill="#1a1a1a" letter-spacing="-0.2">returns the receipt column order.</text>
    <text x="0" y="106" font-family="Source Serif 4, Georgia, serif" font-size="16" fill="#2e2e2c">The JSON export at <tspan font-family="ui-monospace, Geist Mono, Menlo" font-size="12.5">/orders.json</tspan> is untouched — the CSV path branches inside</text>
    <text x="0" y="128" font-family="Source Serif 4, Georgia, serif" font-size="16" fill="#2e2e2c"><tspan font-family="ui-monospace, Geist Mono, Menlo" font-size="12.5">respond_to</tspan> so the wire format is the only difference. All 14 request specs pass,</text>
    <text x="0" y="150" font-family="Source Serif 4, Georgia, serif" font-size="16" fill="#2e2e2c">including 8 new ones covering empty results and the date-range edge cases.</text>
    <text x="0" y="188" font-family="Source Serif 4, Georgia, serif" font-size="16" fill="#2e2e2c">Worth flagging before merge: large exports stream chunked, so cancelling the</text>
    <text x="0" y="210" font-family="Source Serif 4, Georgia, serif" font-size="16" fill="#2e2e2c">request mid-download leaves a partial file.</text>
  </g>
</svg>
