<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" font-family="-apple-system, system-ui, Segoe UI, sans-serif">
  <!-- ClaudeCadence — iter6 design preview, synthetic data (BloomList fictional project).
