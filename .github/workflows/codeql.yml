name: CodeQL

# Static analysis on every push to main and every PR. Surfaces any findings
# in the repository's Security tab. The plugin has zero runtime dependencies
# and the entire codebase is JavaScript (Node) — analyzing one language is
# enough.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Re-scan weekly even when there are no new pushes, so newly-published
    # CodeQL queries flag issues we wouldn't otherwise see.
    - cron: '23 4 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          # security-extended adds queries beyond the default set — worth
          # the extra runtime for a security-sensitive plugin.
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"
